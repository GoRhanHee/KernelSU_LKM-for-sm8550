name: Build KernelSU LKM for SM8550

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernelsu-lkm-sm8550-${{ github.ref }}
  cancel-in-progress: true

env:
  COMMON_REPOSITORY_URL: https://github.com/GoRhanHee/android_kernel_samsung_sm8550_common.git
  COMMON_REF: android13-5.15-sm8550
  TOOLCHAIN_VERSION: r614150
  TOOLCHAIN_URL: https://github.com/GoRhanHee/samsung_sm8550_toolchain/releases/download/clang23-ndk26d/toolchain-clang23-ndk26d.tar.xz
  GOOGLE_BRANCH: android13-5.15
  KMI_GENERATION: "8"
  BUILD_JOBS: "16"

jobs:
  build-kernelsu:
    name: Build ${{ matrix.name }} LKM
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: kernelsu-next
            name: KernelSU-Next
            repository: KernelSU-Next/KernelSU-Next
            ref: 36aa55c521e509449bfe48bae0ab8c397174c1cb
            module_file: kernelsu.ko
          - id: xxkernelsu
            name: xxKernelSU
            repository: backslashxx/KernelSU
            ref: db65bfc28ca116af7fc41e83f63c05b95d7d7754
            module_file: ksu.ko
          - id: kernelsu-original
            name: KernelSU
            repository: tiann/KernelSU
            ref: 3c1240625655978f319a98398031100b80e9da7c
            module_file: kernelsu.ko
          - id: kowsu
            name: KowSU
            repository: KOWX712/KernelSU
            ref: 36adc22d2fe53c8d6bc379a160133d8c562e2401
            module_file: kernelsu.ko
          - id: mksu
            name: MKSU
            repository: 5ec1cff/KernelSU
            ref: 6a4cac03f35751b066fcbb08e24fb8198ca354e1
            module_file: kernelsu.ko
          - id: sukisu-ultra
            name: SukiSU Ultra
            repository: SukiSU-Ultra/SukiSU-Ultra
            ref: 9fbe8fe8ca90c62c259c5894bf96d02ac31209b9
            module_file: kernelsu.ko
          - id: resukisu
            name: ReSukiSU
            repository: ReSukiSU/ReSukiSU
            ref: 3c1882886dbbb54f4aae7ddf205f8ccde32c2a34
            module_file: kernelsu.ko

    steps:
      - name: Clone common kernel source from upstream URL
        shell: bash
        run: |
          set -euxo pipefail
          git clone \
            --depth=1 \
            --single-branch \
            --branch "$COMMON_REF" \
            "$COMMON_REPOSITORY_URL" \
            "$GITHUB_WORKSPACE/common"

      - name: Checkout kernel config from this repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: kernel-config
          sparse-checkout: |
            custom_defconfigs/gorhanhee_defconfig
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout KSU source
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ksu-source
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            kmod \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            dwarves \
            python3 \
            rsync

      - name: Cache clang toolchain
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: prebuilts
          key: sm8550-clang-${{ env.TOOLCHAIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download clang toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "$TOOLCHAIN_URL" \
            --output "$RUNNER_TEMP/toolchain.tar.xz"
          tar -xf "$RUNNER_TEMP/toolchain.tar.xz" \
            -C "$GITHUB_WORKSPACE" \
            --strip-components=1 \
            toolchain/prebuilts

      - name: Select clang toolchain
        shell: bash
        run: |
          set -euxo pipefail
          toolchain_bin="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-$TOOLCHAIN_VERSION/bin"
          test -x "$toolchain_bin/clang"
          export PATH="$toolchain_bin:$PATH"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          test "$(command -v clang)" = "$toolchain_bin/clang"
          test "$(command -v ld.lld)" = "$toolchain_bin/ld.lld"
          clang --version
          ld.lld --version

      - name: Integrate KernelSU Kconfig for this build
        shell: bash
        run: |
          set -euxo pipefail
          kernel_src="$GITHUB_WORKSPACE/common"
          ksu_dir="$GITHUB_WORKSPACE/ksu-source/kernel"
          driver_dir="$kernel_src/drivers"

          test -d "$ksu_dir"
          test ! -e "$driver_dir/kernelsu"
          ln -s "$(realpath --relative-to="$driver_dir" "$ksu_dir")" "$driver_dir/kernelsu"

          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' "$driver_dir/Kconfig"; then
            sed -i '/^endmenu$/i source "drivers\/kernelsu\/Kconfig"' "$driver_dir/Kconfig"
          fi
          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' "$driver_dir/Makefile"; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$driver_dir/Makefile"
          fi

      - name: Prepare kernel configuration
        shell: bash
        run: |
          set -euxo pipefail
          kernel_src="$GITHUB_WORKSPACE/common"
          kernel_out="$GITHUB_WORKSPACE/kernel-out"
          kernel_config="$GITHUB_WORKSPACE/kernel-config/custom_defconfigs/gorhanhee_defconfig"
          ksu_dir="$GITHUB_WORKSPACE/ksu-source/kernel"

          git config --global --add safe.directory "$kernel_src"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ksu-source"
          test -s "$kernel_config"
          test -d "$ksu_dir"

          make -C "$kernel_src" \
            O="$kernel_out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            GOOGLE_BRANCH="$GOOGLE_BRANCH" \
            KMI_GENERATION="$KMI_GENERATION" \
            gki_defconfig

          (
            cd "$kernel_out"
            "$kernel_src/scripts/kconfig/merge_config.sh" \
              -m .config \
              "$kernel_config"
          )

          "$kernel_src/scripts/config" --file "$kernel_out/.config" \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e THINLTO \
            -e CFI_CLANG \
            -e MODULES \
            -e MODULE_UNLOAD \
            -e MODVERSIONS \
            -e KPROBES \
            -e EXT4_FS \
            -m KSU \
            --set-str LOCALVERSION "-GoRhanHee-Kernel" \
            -d LOCALVERSION_AUTO

          make -C "$kernel_src" \
            O="$kernel_out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            GOOGLE_BRANCH="$GOOGLE_BRANCH" \
            KMI_GENERATION="$KMI_GENERATION" \
            olddefconfig

          test "$(grep -E '^CONFIG_KSU=' "$kernel_out/.config")" = "CONFIG_KSU=m"

          grep -E '^(CONFIG_(KSU|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL|THINLTO|CFI_CLANG|MODULES|MODULE_UNLOAD|MODVERSIONS|KPROBES|EXT4_FS|LOCALVERSION))=' \
            "$kernel_out/.config" || true

      - name: Prepare kernel build tree
        shell: bash
        run: |
          set -euxo pipefail
          kernel_src="$GITHUB_WORKSPACE/common"
          kernel_out="$GITHUB_WORKSPACE/kernel-out"

          make -C "$kernel_src" \
            O="$kernel_out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            GOOGLE_BRANCH="$GOOGLE_BRANCH" \
            KMI_GENERATION="$KMI_GENERATION" \
            modules_prepare

          # CONFIG_MODVERSIONS requires the kernel's real symbol CRC dump.
          # modules_prepare intentionally does not generate Module.symvers.
          # Build vmlinux in Actions so vmlinux.symvers contains the CRC for
          # module_layout and all other built-in exported symbols.
          make -C "$kernel_src" \
            O="$kernel_out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            GOOGLE_BRANCH="$GOOGLE_BRANCH" \
            KMI_GENERATION="$KMI_GENERATION" \
            vmlinux \
            -j"$BUILD_JOBS"

          test -s "$kernel_out/vmlinux.symvers"
          cp "$kernel_out/vmlinux.symvers" "$kernel_out/Module.symvers"
          test -s "$kernel_out/Module.symvers"
          grep -Eq '(^|[[:space:]])module_layout([[:space:]]|$)' \
            "$kernel_out/Module.symvers"

          kernel_release="$(make -s -C "$kernel_src" \
            O="$kernel_out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            GOOGLE_BRANCH="$GOOGLE_BRANCH" \
            KMI_GENERATION="$KMI_GENERATION" \
            kernelrelease)"
          echo "Kernel release: $kernel_release"
          echo "KERNEL_RELEASE=$kernel_release" >> "$GITHUB_ENV"

      - name: Build only ${{ matrix.module_file }}
        shell: bash
        run: |
          set -euxo pipefail
          kernel_out="$GITHUB_WORKSPACE/kernel-out"
          ksu_dir="$GITHUB_WORKSPACE/ksu-source/kernel"
          module_file="${{ matrix.module_file }}"

          make -C "$kernel_out" \
            M="$ksu_dir" \
            src="$ksu_dir" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_KSU=m \
            KBUILD_MODPOST_WARN=1 \
            modules -j"$BUILD_JOBS"

          module_path="$ksu_dir/$module_file"
          test -s "$module_path"

      - name: Validate ${{ matrix.module_file }}
        shell: bash
        run: |
          set -euxo pipefail
          module_path="$GITHUB_WORKSPACE/ksu-source/kernel/${{ matrix.module_file }}"

          test "$(llvm-readelf -h "$module_path" | awk -F: '/Class:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')" = "ELF64"
          test "$(llvm-readelf -h "$module_path" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')" = "AArch64"

          module_vermagic="$(modinfo -F vermagic "$module_path")"
          echo "Expected kernel release: $KERNEL_RELEASE"
          echo "Module vermagic: $module_vermagic"
          case "$module_vermagic" in
            "$KERNEL_RELEASE"*) ;;
            *)
              echo "${{ matrix.module_file }} vermagic does not match the generated kernel"
              exit 1
              ;;
          esac

          if llvm-readelf -Ws "$module_path" | grep -Eq '__cfi_slowpath_diag|__ubsan_handle_cfi_check_fail_abort'; then
            echo "Found legacy CFI symbols in ${{ matrix.module_file }}"
            exit 1
          fi

          versions_size="$(llvm-readelf -SW "$module_path" | awk '$2 == "__versions" { size = "0x" $6 } END { print size }')"
          test -n "$versions_size"
          test "$versions_size" != "0x0"
          echo "__versions size: $versions_size"
          llvm-readelf -S "$module_path" | grep -E '__versions|\.modinfo|\.kcfi_traps'
          llvm-strip -d "$module_path"
          test -s "$module_path"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-lkm-sm8550-${{ matrix.id }}
          path: ksu-source/kernel/${{ matrix.module_file }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
